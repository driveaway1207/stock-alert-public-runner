name: Employee3 one-time latest-close recovery
run-name: Employee3 one-time recovery dispatcher

"on":
  push:
    branches:
      - main
    paths:
      - ".github/workflows/employee3_recovery_dispatch_20261103.yml"

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    name: Dispatch employee3 for 2026-11-02 close
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch protected original employee3 workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run employee3_runner.yml \
            --repo "$GH_REPO" \
            --ref main \
            -f employee3_target_date=2026-11-02 \
            -f employee3_send_telegram='🟩 是｜发送Telegram' \
            -f employee3_baostock_fallback='🟧 是｜允许补拉最近K线'
          echo "Employee3 historical-target workflow_dispatch accepted for 2026-11-02"
